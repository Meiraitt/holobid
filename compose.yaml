services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: holobid_admin_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/prisma/local-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
