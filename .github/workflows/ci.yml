name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, builds and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      main-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-ci-main
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      audit-db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ephemeral-ci-audit
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HOLOBID_CI_MAIN_CONTAINER: ${{ job.services.main-db.id }}
      HOLOBID_CI_AUDIT_CONTAINER: ${{ job.services.audit-db.id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.21.1
      - name: Install dependencies
        run: npm ci
      - name: Validate the workspace
        run: npm run check

  browser-journeys:
    name: Isolated browser journeys and accessibility
    # Public repositories have free standard runners. Do not spend private-repo minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the pinned npm version
        run: npm install --global npm@11.21.1
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys against disposable databases
        run: npm run test:e2e
